<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Là Triệu Phú - Lịch Sử 7</title>
    <style>
        /* =========================================
           RESET & BIẾN CSS KHỞI TẠO
        ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-color: #0b0c10;
            --primary-blue: #101c54;
            --light-blue: #1e3a8a;
            --gold: #ffd700;
            --gold-hover: #ffea00;
            --text-main: #ffffff;
            --wrong-red: #dc2626;
            --correct-green: #16a34a;
            --selected-orange: #ea580c;
        }

        body {
            background: radial-gradient(circle at center, var(--light-blue), var(--bg-color));
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* =========================================
           MÀN HÌNH CHUNG
        ========================================= */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            background: radial-gradient(circle at center, rgba(30, 58, 138, 0.9), rgba(11, 12, 16, 1));
        }

        .screen.active {
            display: flex;
        }

        /* =========================================
           MÀN HÌNH BẮT ĐẦU & KẾT THÚC
        ========================================= */
        .title-box {
            text-align: center;
            margin-bottom: 40px;
            animation: glow 2s infinite alternate;
        }

        .title-box h1 {
            font-size: 3.5rem;
            color: var(--gold);
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold);
            margin-bottom: 10px;
        }

        .title-box h2 {
            font-size: 1.5rem;
            color: #93c5fd;
        }

        .btn-large {
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(to bottom, #1e3a8a, #101c54);
            border: 2px solid var(--gold);
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-large:hover {
            background: linear-gradient(to bottom, #2563eb, #1e3a8a);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
            transform: scale(1.05);
        }

        .result-stats {
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.8;
        }

        .result-stats span {
            color: var(--gold);
            font-weight: bold;
            font-size: 2rem;
        }

        /* =========================================
           MÀN HÌNH CHƠI GAME
        ========================================= */
        #game-screen {
            display: none;
            grid-template-columns: 1fr 300px;
            height: 100vh;
            width: 100%;
        }

        #game-screen.active {
            display: grid;
        }

        /* Phần bên trái: Câu hỏi & Trợ giúp */
        .main-game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 20px;
            position: relative;
        }

        /* Header (Nút âm thanh) */
        .game-header {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: rgba(16, 28, 84, 0.8);
            border: 1px solid var(--gold);
            color: var(--gold);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .icon-btn:hover {
            background: var(--gold);
            color: var(--bg-color);
        }

        /* Khung hiển thị Trợ giúp */
        .lifelines {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .lifeline {
            width: 70px;
            height: 50px;
            background: linear-gradient(to bottom, #1e3a8a, #101c54);
            border: 2px solid var(--gold);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            transition: 0.3s;
            color: var(--gold);
        }

        .lifeline:hover:not(.used) {
            background: var(--gold);
            color: #000;
        }

        .lifeline.used {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #555;
            color: #555;
            box-shadow: none;
        }

        /* Đồng hồ & Thanh tiến trình */
        .timer-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #0b0c10, #101c54);
            border: 3px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        /* Khung câu hỏi */
        .question-box {
            width: 90%;
            background: linear-gradient(to right, transparent, rgba(16, 28, 84, 0.9), transparent);
            border-top: 2px solid var(--gold);
            border-bottom: 2px solid var(--gold);
            padding: 30px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grid Đáp án */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 90%;
            margin-bottom: 40px;
        }

        .answer-btn {
            position: relative;
            background: linear-gradient(to bottom, #1e3a8a, #101c54);
            border: 2px solid #3b82f6;
            color: white;
            padding: 15px 20px;
            font-size: 1.2rem;
            text-align: left;
            cursor: pointer;
            clip-path: polygon(5% 0, 95% 0, 100% 50%, 95% 100%, 5% 100%, 0% 50%);
            transition: all 0.3s;
        }

        .answer-btn:hover:not(.disabled):not(.selected):not(.correct):not(.wrong) {
            background: linear-gradient(to bottom, #2563eb, #1d4ed8);
            border-color: var(--gold);
        }

        .answer-btn span.letter {
            color: var(--gold);
            font-weight: bold;
            margin-right: 10px;
        }

        /* Trạng thái đáp án */
        .answer-btn.selected {
            background: var(--selected-orange);
            border-color: #fff;
            color: #fff;
        }

        .answer-btn.correct {
            background: var(--correct-green);
            animation: blink-correct 0.3s 5;
        }

        .answer-btn.wrong {
            background: var(--wrong-red);
        }

        .answer-btn.disabled {
            visibility: hidden; /* Cho quyền 50:50 */
        }

        /* Phần bên phải: Thang tiền thưởng */
        .ladder-area {
            background: rgba(11, 12, 16, 0.9);
            border-left: 2px solid var(--gold);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .ladder-list {
            list-style: none;
            display: flex;
            flex-direction: column-reverse; /* Câu 1 ở dưới, 15 ở trên */
            gap: 5px;
        }

        .ladder-item {
            padding: 8px 15px;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            border-radius: 5px;
            color: #9ca3af;
        }

        .ladder-item.safe-zone {
            color: #fff;
            font-weight: bold;
        }

        .ladder-item.active {
            background: var(--selected-orange);
            color: #fff;
            font-weight: bold;
            border: 1px solid var(--gold);
        }

        .ladder-item.passed {
            color: var(--gold);
        }

        /* =========================================
           MODAL (Cửa sổ bật lên cho Trợ giúp)
        ========================================= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: linear-gradient(to bottom, #1e3a8a, #101c54);
            border: 2px solid var(--gold);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            min-width: 400px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .modal-content h3 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        /* Biểu đồ khán giả */
        .chart-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 200px;
            margin-bottom: 20px;
            border-bottom: 2px solid #fff;
            padding-bottom: 10px;
        }

        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40px;
        }

        .bar {
            width: 100%;
            background: var(--gold);
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            transition: height 1s ease-out;
            height: 0;
        }

        .bar-label { margin-top: 10px; font-weight: bold; }
        .bar-percent { margin-bottom: 5px; font-size: 0.9rem;}

        .close-btn {
            padding: 10px 20px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        /* =========================================
           ANIMATIONS
        ========================================= */
        @keyframes glow {
            from { text-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold); }
            to { text-shadow: 0 0 20px var(--gold), 0 0 30px #ffea00, 0 0 40px #ffea00; }
        }

        @keyframes blink-correct {
            0%, 100% { background: var(--correct-green); }
            50% { background: #1e3a8a; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        
        .shake { animation: shake 0.5s; }

        /* =========================================
           RESPONSIVE (ĐIỆN THOẠI / MÁY TÍNH BẢNG)
        ========================================= */
        @media (max-width: 900px) {
            #game-screen {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .ladder-area {
                border-left: none;
                border-top: 2px solid var(--gold);
                padding: 10px;
                overflow-x: auto;
            }
            .ladder-list {
                flex-direction: row;
                gap: 10px;
                min-width: max-content;
            }
            .ladder-item {
                flex-direction: column;
                text-align: center;
                font-size: 0.9rem;
            }
            .title-box h1 { font-size: 2rem; }
            .answers-grid { grid-template-columns: 1fr; }
            .question-box { font-size: 1.2rem; padding: 20px;}
            .timer-container { width: 60px; height: 60px; font-size: 1.5rem; top: 10px; right: 10px;}
            .modal-content { min-width: 90%; }
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH BẮT ĐẦU -->
    <div id="start-screen" class="screen active">
        <div class="title-box">
            <h1>Ai Là Triệu Phú</h1>
            <h2>Lịch Sử 7: Quá trình hình thành & phát triển chế độ phong kiến ở Tây Âu</h2>
        </div>
        <button class="btn-large" onclick="game.start()">Bắt đầu chơi</button>
    </div>

    <!-- MÀN HÌNH CHƠI GAME -->
    <div id="game-screen">
        <div class="main-game-area">
            <div class="game-header">
                <button class="icon-btn" id="btn-sound" onclick="audio.toggleMute()" title="Bật/Tắt âm thanh">🔊</button>
            </div>

            <div class="timer-container" id="timer">30</div>

            <div class="lifelines">
                <button class="lifeline" id="ll-5050" onclick="game.use5050()" title="Trợ giúp 50:50">50:50</button>
                <button class="lifeline" id="ll-audience" onclick="game.useAudience()" title="Hỏi ý kiến khán giả">👥</button>
                <button class="lifeline" id="ll-call" onclick="game.useCall()" title="Gọi điện thoại cho người thân">📞</button>
            </div>

            <div class="question-box" id="question-text">
                Đang tải câu hỏi...
            </div>

            <div class="answers-grid" id="answers-container">
                <!-- Nút đáp án tạo bằng JS -->
            </div>
        </div>

        <div class="ladder-area">
            <ul class="ladder-list" id="ladder-list">
                <!-- Thang điểm tạo bằng JS -->
            </ul>
        </div>
    </div>

    <!-- MÀN HÌNH KẾT THÚC -->
    <div id="end-screen" class="screen">
        <div class="title-box">
            <h1 id="end-title">Trò Chơi Kết Thúc!</h1>
        </div>
        <div class="result-stats">
            Bạn đã vượt qua: <span id="res-level">0</span>/15 câu<br>
            Tiền thưởng đạt được: <span id="res-prize">0</span> VND
        </div>
        <button class="btn-large" onclick="game.reset()">Chơi Lại</button>
    </div>

    <!-- MODAL KHÁN GIẢ -->
    <div id="modal-audience" class="modal-overlay">
        <div class="modal-content">
            <h3>Ý KIẾN KHÁN GIẢ TRƯỜNG QUAY</h3>
            <div class="chart-container">
                <div class="bar-wrapper"><div class="bar-percent" id="aud-p-0">0%</div><div class="bar" id="aud-bar-0"></div><div class="bar-label">A</div></div>
                <div class="bar-wrapper"><div class="bar-percent" id="aud-p-1">0%</div><div class="bar" id="aud-bar-1"></div><div class="bar-label">B</div></div>
                <div class="bar-wrapper"><div class="bar-percent" id="aud-p-2">0%</div><div class="bar" id="aud-bar-2"></div><div class="bar-label">C</div></div>
                <div class="bar-wrapper"><div class="bar-percent" id="aud-p-3">0%</div><div class="bar" id="aud-bar-3"></div><div class="bar-label">D</div></div>
            </div>
            <button class="close-btn" onclick="document.getElementById('modal-audience').classList.remove('active')">Đóng</button>
        </div>
    </div>

    <!-- MODAL GỌI ĐIỆN -->
    <div id="modal-call" class="modal-overlay">
        <div class="modal-content">
            <h3>GỌI ĐIỆN THOẠI CHO NGƯỜI THÂN</h3>
            <div style="font-size: 4rem; margin-bottom: 20px;">📱</div>
            <p id="call-text" style="font-size: 1.2rem; line-height: 1.5; margin-bottom: 20px;">Đang kết nối...</p>
            <button class="close-btn" onclick="document.getElementById('modal-call').classList.remove('active')">Cảm ơn</button>
        </div>
    </div>

    <script>
        /* =========================================
           NGÂN HÀNG CÂU HỎI (Giáo viên có thể sửa ở đây)
           Cấu trúc: { q: "Câu hỏi", options: ["A", "B", "C", "D"], correct: index (0-3) }
        ========================================= */
        const QUESTION_BANK = [
            {
                q: "Đế quốc La Mã sụp đổ vào năm nào?",
                options: ["Năm 476", "Năm 476 TCN", "Năm 1492", "Năm 1009"],
                correct: 0
            },
            {
                q: "Những người từ bên ngoài tràn vào xâm nhập và tiêu diệt đế quốc La Mã là ai?",
                options: ["Người Hi Lạp", "Người Giéc-man", "Người Ả Rập", "Người Mông Cổ"],
                correct: 1
            },
            {
                q: "Sau khi tràn vào lãnh thổ La Mã, người Giéc-man đã phế truất hoàng đế La Mã và lập nên nhiều vương quốc mới. Vương quốc nào sau đây KHÔNG phải của người Giéc-man?",
                options: ["Vương quốc Ăng-glô Xắc-xông", "Vương quốc Phơ-răng", "Vương quốc Tây Gốt", "Vương quốc Chăm-pa"],
                correct: 3
            },
            {
                q: "Trong xã hội phong kiến Tây Âu, giai cấp nào vừa có ruộng đất, vừa có tước vị, có quyền thế lớn?",
                options: ["Lãnh chúa phong kiến", "Nông nô", "Thương nhân", "Thợ thủ công"],
                correct: 0
            },
            {
                q: "Nông nô trong xã hội phong kiến Tây Âu có nguồn gốc chủ yếu từ đâu?",
                options: ["Nô lệ được giải phóng và nông dân tự do mất ruộng đất", "Lãnh chúa bị tước đoạt tài sản", "Thợ thủ công bị phá sản", "Thương nhân từ phương Đông đến"],
                correct: 0
            },
            {
                q: "Đơn vị chính trị và kinh tế cơ bản của Tây Âu thời phong kiến là gì?",
                options: ["Thành thị", "Lãnh địa phong kiến", "Làng xã", "Công xưởng"],
                correct: 1
            },
            {
                q: "Đặc điểm nổi bật về kinh tế trong lãnh địa phong kiến Tây Âu là gì?",
                options: ["Kinh tế hàng hoá, trao đổi buôn bán", "Kinh tế công nghiệp", "Kinh tế đóng kín, tự cấp tự túc", "Kinh tế mở, giao thương quốc tế"],
                correct: 2
            },
            {
                q: "Công trình kiến trúc đồ sộ, kiên cố nhất, là nơi ở của lãnh chúa trong lãnh địa gọi là gì?",
                options: ["Nhà thờ", "Chợ", "Lâu đài", "Xưởng thủ công"],
                correct: 2
            },
            {
                q: "Thành thị trung đại ở Tây Âu bắt đầu xuất hiện vào thời gian nào?",
                options: ["Thế kỉ V", "Thế kỉ XI", "Thế kỉ XV", "Thế kỉ XVIII"],
                correct: 1
            },
            {
                q: "Thành phần cư dân chủ yếu của thành thị trung đại Tây Âu là ai?",
                options: ["Lãnh chúa và nông nô", "Thợ thủ công và thương nhân", "Quý tộc và giáo sĩ", "Nô lệ và chủ nô"],
                correct: 1
            },
            {
                q: "Để bảo vệ quyền lợi trong sản xuất và buôn bán ở thành thị, các thợ thủ công đã lập ra tổ chức gì?",
                options: ["Phường hội", "Thương hội", "Công hội", "Nông hội"],
                correct: 0
            },
            {
                q: "Sự ra đời của thành thị trung đại có vai trò gì đối với sự phát triển của chế độ phong kiến Tây Âu?",
                options: ["Củng cố nền kinh tế tự nhiên", "Làm cho lãnh địa phong kiến phát triển mạnh hơn", "Góp phần xoá bỏ chế độ phân quyền, xây dựng chế độ tập quyền", "Đưa nông nô trở lại thành nô lệ"],
                correct: 2
            },
            {
                q: "Thành thị trung đại đã mang lại bầu không khí như thế nào cho xã hội Tây Âu?",
                options: ["Bầu không khí tự do, cởi mở", "Bầu không khí ngột ngạt, áp bức", "Bầu không khí đóng kín, bảo thủ", "Bầu không khí chiến tranh liên miên"],
                correct: 0
            },
            {
                q: "Trường đại học nào sau đây là một trong những trường nổi tiếng được thành lập từ thời trung đại ở I-ta-li-a?",
                options: ["Hác-vớt (Harvard)", "Bô-lô-na (Bologna)", "Ô-x-phớt (Oxford)", "Cem-brít (Cambridge)"],
                correct: 1
            },
            {
                q: "Nhà tư tưởng C.Mác đã ví hiện tượng nào như 'những bông hoa rực rỡ nhất của châu Âu thời trung đại'?",
                options: ["Lãnh địa phong kiến", "Lâu đài của lãnh chúa", "Nhà thờ Công giáo", "Thành thị trung đại"],
                correct: 3
            }
        ];

        // Mốc tiền thưởng (15 câu)
        const PRIZES = [
            "200.000", "400.000", "600.000", "1.000.000", "2.000.000", /* Mốc 1: Câu 5 */
            "3.000.000", "6.000.000", "10.000.000", "14.000.000", "22.000.000", /* Mốc 2: Câu 10 */
            "30.000.000", "40.000.000", "60.000.000", "85.000.000", "150.000.000" /* Mốc 3: Câu 15 */
        ];
        const SAFE_MILESTONES = [5, 10, 15];
        const LETTERS = ["A", "B", "C", "D"];

        /* =========================================
           HỆ THỐNG ÂM THANH (Dùng Web Audio API tạo âm thanh offline)
        ========================================= */
        class AudioController {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.isMuted = false;
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                document.getElementById('btn-sound').innerText = this.isMuted ? '🔇' : '🔊';
            }

            // Tạo âm báo cơ bản
            playTone(frequency, type, duration) {
                if (this.isMuted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(frequency, this.ctx.currentTime);
                
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playTick() { this.playTone(600, 'sine', 0.1); }
            
            playSelect() {
                if (this.isMuted) return;
                this.playTone(400, 'square', 0.2);
            }

            playCorrect() {
                if (this.isMuted) return;
                // Chuỗi âm thanh đúng (Ascending)
                setTimeout(() => this.playTone(400, 'sine', 0.2), 0);
                setTimeout(() => this.playTone(600, 'sine', 0.2), 150);
                setTimeout(() => this.playTone(800, 'sine', 0.4), 300);
            }

            playWrong() {
                if (this.isMuted) return;
                // Âm thanh sai (Descending)
                setTimeout(() => this.playTone(300, 'sawtooth', 0.3), 0);
                setTimeout(() => this.playTone(150, 'sawtooth', 0.5), 200);
            }

            playWin() {
                if (this.isMuted) return;
                let time = 0;
                [400, 500, 600, 800, 600, 800, 1000].forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.2), time);
                    time += 200;
                });
            }
        }

        const audio = new AudioController();

        /* =========================================
           LOGIC TRÒ CHƠI
        ========================================= */
        class GameController {
            constructor() {
                this.currentQuestionIndex = 0;
                this.timer = 30;
                this.interval = null;
                this.isAnswering = false;
                
                this.lifelines = {
                    fifty: true,
                    audience: true,
                    call: true
                };

                this.initUI();
            }

            initUI() {
                // Tạo thang tiền thưởng
                const ladderList = document.getElementById('ladder-list');
                ladderList.innerHTML = '';
                for (let i = 0; i < PRIZES.length; i++) {
                    const li = document.createElement('li');
                    li.className = 'ladder-item';
                    if (SAFE_MILESTONES.includes(i + 1)) li.classList.add('safe-zone');
                    li.innerHTML = `<span>${i + 1}</span> <span>${PRIZES[i]}</span>`;
                    li.id = `ladder-${i}`;
                    ladderList.appendChild(li);
                }
            }

            start() {
                // Bắt buộc Audio Context khởi chạy (policy trình duyệt)
                if(audio.ctx.state === 'suspended') audio.ctx.resume();

                document.getElementById('start-screen').classList.remove('active');
                document.getElementById('end-screen').classList.remove('active');
                document.getElementById('game-screen').classList.add('active');
                
                this.currentQuestionIndex = 0;
                this.lifelines = { fifty: true, audience: true, call: true };
                
                // Đặt lại UI trợ giúp
                document.getElementById('ll-5050').classList.remove('used');
                document.getElementById('ll-audience').classList.remove('used');
                document.getElementById('ll-call').classList.remove('used');

                this.loadQuestion();
            }

            loadQuestion() {
                this.isAnswering = false;
                const qData = QUESTION_BANK[this.currentQuestionIndex];
                
                // Cập nhật câu hỏi
                document.getElementById('question-text').innerText = `Câu ${this.currentQuestionIndex + 1}: ${qData.q}`;

                // Cập nhật đáp án
                const answersContainer = document.getElementById('answers-container');
                answersContainer.innerHTML = '';
                
                qData.options.forEach((opt, index) => {
                    const btn = document.createElement('div');
                    btn.className = 'answer-btn';
                    btn.id = `ans-${index}`;
                    btn.innerHTML = `<span class="letter">${LETTERS[index]}:</span> ${opt}`;
                    btn.onclick = () => this.selectAnswer(index);
                    answersContainer.appendChild(btn);
                });

                // Cập nhật thang tiền thưởng
                document.querySelectorAll('.ladder-item').forEach(el => {
                    el.classList.remove('active');
                    el.classList.remove('passed');
                });
                for(let i = 0; i <= this.currentQuestionIndex; i++){
                    if(i < this.currentQuestionIndex) {
                        document.getElementById(`ladder-${i}`).classList.add('passed');
                    } else {
                        document.getElementById(`ladder-${i}`).classList.add('active');
                    }
                }

                // Scroll thang tiền thưởng (mobile)
                const activeLadder = document.getElementById(`ladder-${this.currentQuestionIndex}`);
                if(activeLadder) activeLadder.scrollIntoView({behavior: "smooth", block: "center", inline: "center"});

                this.startTimer();
            }

            startTimer() {
                clearInterval(this.interval);
                this.timer = 30;
                document.getElementById('timer').innerText = this.timer;
                
                this.interval = setInterval(() => {
                    this.timer--;
                    document.getElementById('timer').innerText = this.timer;
                    if(this.timer <= 5) audio.playTick(); // Tick gấp rút

                    if (this.timer <= 0) {
                        clearInterval(this.interval);
                        this.timeOut();
                    }
                }, 1000);
            }

            selectAnswer(index) {
                if (this.isAnswering) return;
                this.isAnswering = true;
                clearInterval(this.interval);

                const btn = document.getElementById(`ans-${index}`);
                btn.classList.add('selected');
                audio.playSelect();

                // Đợi 2s tạo kịch tính
                setTimeout(() => {
                    const correctIndex = QUESTION_BANK[this.currentQuestionIndex].correct;
                    if (index === correctIndex) {
                        this.handleCorrect(index);
                    } else {
                        this.handleWrong(index, correctIndex);
                    }
                }, 2000);
            }

            handleCorrect(index) {
                audio.playCorrect();
                const btn = document.getElementById(`ans-${index}`);
                btn.classList.remove('selected');
                btn.classList.add('correct');

                setTimeout(() => {
                    this.currentQuestionIndex++;
                    if (this.currentQuestionIndex >= QUESTION_BANK.length) {
                        this.endGame(true);
                    } else {
                        this.loadQuestion();
                    }
                }, 2500);
            }

            handleWrong(selectedIndex, correctIndex) {
                audio.playWrong();
                document.querySelector('.main-game-area').classList.add('shake');
                
                const selectedBtn = document.getElementById(`ans-${selectedIndex}`);
                const correctBtn = document.getElementById(`ans-${correctIndex}`);
                
                selectedBtn.classList.remove('selected');
                selectedBtn.classList.add('wrong');
                correctBtn.classList.add('correct');

                setTimeout(() => {
                    document.querySelector('.main-game-area').classList.remove('shake');
                    this.endGame(false);
                }, 3000);
            }

            timeOut() {
                this.isAnswering = true;
                audio.playWrong();
                const correctIndex = QUESTION_BANK[this.currentQuestionIndex].correct;
                document.getElementById(`ans-${correctIndex}`).classList.add('correct');
                
                setTimeout(() => {
                    this.endGame(false);
                }, 3000);
            }

            endGame(isWin) {
                document.getElementById('game-screen').classList.remove('active');
                document.getElementById('end-screen').classList.add('active');

                let title = isWin ? "XUẤT SẮC! BẠN LÀ TRIỆU PHÚ!" : "RẤT TIẾC, TRÒ CHƠI KẾT THÚC";
                let prizeIndex = -1;

                if (isWin) {
                    audio.playWin();
                    prizeIndex = 14; // Index 14 là câu 15
                } else {
                    // Tìm mốc an toàn gần nhất
                    if (this.currentQuestionIndex >= 10) prizeIndex = 9; // Câu 10
                    else if (this.currentQuestionIndex >= 5) prizeIndex = 4; // Câu 5
                }

                document.getElementById('end-title').innerText = title;
                document.getElementById('end-title').style.color = isWin ? "var(--correct-green)" : "var(--wrong-red)";
                document.getElementById('res-level').innerText = this.currentQuestionIndex;
                document.getElementById('res-prize').innerText = prizeIndex >= 0 ? PRIZES[prizeIndex] : "0";
            }

            reset() {
                this.start();
            }

            /* --- CÁC QUYỀN TRỢ GIÚP --- */
            use5050() {
                if (!this.lifelines.fifty || this.isAnswering) return;
                this.lifelines.fifty = false;
                document.getElementById('ll-5050').classList.add('used');
                audio.playSelect();

                const correctIndex = QUESTION_BANK[this.currentQuestionIndex].correct;
                let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIndex);
                
                // Xáo trộn mảng wrong và lấy 2 phần tử đầu để ẩn
                wrongIndices = wrongIndices.sort(() => Math.random() - 0.5);
                document.getElementById(`ans-${wrongIndices[0]}`).classList.add('disabled');
                document.getElementById(`ans-${wrongIndices[1]}`).classList.add('disabled');
            }

            useAudience() {
                if (!this.lifelines.audience || this.isAnswering) return;
                this.lifelines.audience = false;
                document.getElementById('ll-audience').classList.add('used');
                audio.playSelect();

                const correctIndex = QUESTION_BANK[this.currentQuestionIndex].correct;
                
                // Tạo data giả lập khán giả (Đáp án đúng luôn cao nhất)
                let remaining = 100;
                let stats = [0, 0, 0, 0];
                
                // Đáp án đúng chiếm 40% - 75%
                stats[correctIndex] = Math.floor(Math.random() * 35) + 40; 
                remaining -= stats[correctIndex];

                // Chia phần còn lại cho 3 đáp án sai
                let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIndex);
                for(let i=0; i<2; i++) {
                    let val = Math.floor(Math.random() * (remaining - (2-i)));
                    stats[wrongIndices[i]] = val;
                    remaining -= val;
                }
                stats[wrongIndices[2]] = remaining;

                // Cập nhật UI Modal
                for(let i=0; i<4; i++){
                    document.getElementById(`aud-p-${i}`).innerText = '0%';
                    document.getElementById(`aud-bar-${i}`).style.height = '0%';
                }

                document.getElementById('modal-audience').classList.add('active');

                // Animation thanh biểu đồ
                setTimeout(() => {
                    for(let i=0; i<4; i++){
                        document.getElementById(`aud-p-${i}`).innerText = stats[i] + '%';
                        document.getElementById(`aud-bar-${i}`).style.height = stats[i] + '%';
                    }
                }, 100);
            }

            useCall() {
                if (!this.lifelines.call || this.isAnswering) return;
                this.lifelines.call = false;
                document.getElementById('ll-call').classList.add('used');
                audio.playSelect();

                const correctIndex = QUESTION_BANK[this.currentQuestionIndex].correct;
                let suggestedIndex = correctIndex;

                // 80% cơ hội đưa ra đáp án đúng
                if (Math.random() > 0.8) {
                    let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIndex);
                    // Nếu 50:50 đã dùng, cần lọc các đáp án đã bị ẩn
                    wrongIndices = wrongIndices.filter(i => !document.getElementById(`ans-${i}`).classList.contains('disabled'));
                    suggestedIndex = wrongIndices[Math.floor(Math.random() * wrongIndices.length)];
                }

                const msg = `Theo tớ thì đáp án có vẻ đúng nhất là...<br><br><strong style="font-size: 2rem; color: var(--gold)">Đáp án ${LETTERS[suggestedIndex]}</strong>`;
                
                document.getElementById('call-text').innerHTML = "Đang kết nối...";
                document.getElementById('modal-call').classList.add('active');

                setTimeout(() => {
                    document.getElementById('call-text').innerHTML = msg;
                }, 2000);
            }
        }

        // Khởi tạo Game
        const game = new GameController();

    </script>
